[package]
name = "rustlink-web"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
wasm-streams = "0.5"
web-sys = { version = "0.3", features = ["Window","Document","Element","HtmlElement","HtmlInputElement","HtmlSelectElement","HtmlTextAreaElement","HtmlAnchorElement","Node","NodeList","Event","EventTarget","MouseEvent","MessageEvent","WebSocket","Location","History","FormData","File","FileList","Blob","Response","ReadableStream","console"] }
