[package]
name = "rustlink"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Rust implementation of the FactoryLink industrial gateway"

[workspace]
members = ["web"]
default-members = ["."]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "multipart"] }
calamine = "0.36"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures-util = "0.3"
include_dir = "0.7"
indexmap = "2"
regex = "1"
quick-xml = "0.41"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-serial = "5"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "limit"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
